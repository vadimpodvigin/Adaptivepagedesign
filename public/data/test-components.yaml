workflow:
  title: "Test Components"
  description: "Workflow demonstrating all available components including notifications, tables, steppers, checkboxes, accordions, lists, code snippets, and tabs."
  category: "Testing"
  icon: "experiment"

cards:
  - id: "card1"
    title: "Notifications Component"
    badge: "1"
    description: "This card demonstrates the notifications component with multiple notification types."
    notifications:
      - type: "info"
        title: "Information"
        message: "This is an informational notification message."
      - type: "success"
        title: "Success"
        message: "Operation completed successfully!"
      - type: "warning"
        title: "Warning"
        message: "Please review the following items before proceeding."
    arrows:
      - direction: "down"
        targetCardId: "card2"

  - id: "card2"
    title: "Table Component"
    badge: "2"
    description: "This card demonstrates the table component with sample data."
    table:
      headers:
        - "Name"
        - "Status"
        - "Value"
        - "Date"
      rows:
        - ["Item 1", "Active", "$1,000", "2024-01-15"]
        - ["Item 2", "Pending", "$2,500", "2024-01-16"]
        - ["Item 3", "Completed", "$3,750", "2024-01-17"]
    arrows:
      - direction: "down"
        targetCardId: "card3"

  - id: "card3"
    title: "Stepper Component"
    badge: "3"
    description: "This card demonstrates the stepper component showing workflow progress."
    stepper:
      - label: "Initialize"
        status: "complete"
        description: "Setup and configuration"
      - label: "Process"
        status: "current"
        description: "Processing data"
      - label: "Validate"
        status: "incomplete"
        description: "Validate results"
      - label: "Complete"
        status: "incomplete"
        description: "Finalize workflow"
    arrows:
      - direction: "down"
        targetCardId: "card4"

  - id: "card4"
    title: "Checkbox Component"
    badge: "4"
    description: "This card demonstrates the checkbox component with multiple options."
    checkboxes:
      - label: "Option 1"
        checked: true
      - label: "Option 2"
        checked: false
      - label: "Option 3"
        checked: true
    arrows:
      - direction: "down"
        targetCardId: "card5"

  - id: "card5"
    title: "Accordion Component"
    badge: "5"
    description: "This card demonstrates the accordion component with collapsible sections."
    accordion:
      - title: "Section 1"
        content: "This is the content for section 1 with detailed information."
      - title: "Section 2"
        content: "This is the content for section 2 with more details."
      - title: "Section 3"
        content: "This is the content for section 3 with additional information."
    arrows:
      - direction: "down"
        targetCardId: "card6"

  - id: "card6"
    title: "List Component"
    badge: "6"
    description: "This card demonstrates the list component with ordered and unordered items."
    list:
      type: "ordered"
      items:
        - "First item in the ordered list"
        - "Second item with more details"
        - "Third item concluding the list"
    arrows:
      - direction: "down"
        targetCardId: "card7"

  - id: "card7"
    title: "Code Snippet Component"
    badge: "7"
    description: "This card demonstrates the code snippet component."
    code:
      language: "javascript"
      snippet: |
        const greeting = "Hello, World!";
        console.log(greeting);
        
        function processData(data) {
          return data.map(item => item * 2);
        }
    arrows:
      - direction: "down"
        targetCardId: "card8"

  - id: "card8"
    title: "Tabs Component"
    badge: "8"
    description: "This card demonstrates the tabs component with multiple tab panels."
    tabs:
      - id: "tab1"
        label: "Tab 1"
        content: "This is the content for Tab 1."
        description: "Tab 1 description"
      - id: "tab2"
        label: "Tab 2"
        content: "This is the content for Tab 2 with more information."
        description: "Tab 2 description"
      - id: "tab3"
        label: "Tab 3"
        content: "This is the content for Tab 3 with additional details."
        description: "Tab 3 description"
    arrows:
      - direction: "down"
        targetCardId: "card9"

  - id: "card9"
    title: "Tags Component"
    badge: "9"
    description: "This card demonstrates the tags component."
    tags:
      - label: "Important"
        color: "red"
      - label: "Review"
        color: "blue"
      - label: "Completed"
        color: "green"
    arrows: []
