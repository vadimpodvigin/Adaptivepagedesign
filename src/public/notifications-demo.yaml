cards:
  - id: "notification-demo"
    title: "Notifications Component Demo"
    badge: "1"
    description: "This card demonstrates the new Notifications component that supports multiple notification types."
    color: "#7a23d9"
    sections:
      direction: "col"
      items:
        - title: "Multiple Notifications Example"
          badge: "1"
          description: "This section shows all four notification types (info, success, warning, error) displayed together."
          notifications:
            - type: "info"
              title: "Information Notification"
              message: "This is an informational message to provide helpful context."
            - type: "success"
              title: "Success Notification"
              message: "The operation completed successfully!"
            - type: "warning"
              title: "Warning Notification"
              message: "Please be aware of this important warning message."
            - type: "error"
              title: "Error Notification"
              message: "An error occurred during the operation. Please try again."
        
        - title: "Single Notification Example"
          badge: "2"
          description: "You can also use a single notification if needed."
          notifications:
            - type: "info"
              title: "Single Notification"
              message: "This section has only one notification in the array."
        
        - title: "Custom Notification Messages"
          badge: "3"
          notifications:
            - type: "success"
              title: "Workflow Completed"
              message: "Your workflow has been successfully executed and all steps have passed validation."
            - type: "warning"
              title: "Attention Required"
              message: "Some optional parameters were not provided. Default values will be used."

arrows: []
